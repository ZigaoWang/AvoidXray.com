name: Schema

on:
  push:
    branches: [main]
  pull_request:

# Two things the repository cannot otherwise prove about itself:
#
#   1. prisma/migrations still reproduces schema.prisma. Deploy applies
#      migrations, so a model change with no migration behind it would reach
#      production as code expecting columns nothing created.
#
#   2. The CHECK constraints still exist and still bite. schema.prisma cannot
#      express them, so `migrate diff` passes whether they are there or not.
#
# Replaying from empty is also the only place 0_baseline is ever exercised.
# Production is recorded as having applied it and never will again, so this job
# is the sole evidence that the baseline can build the schema it claims to —
# which is precisely the property the SQLite-era history turned out to lack.
# Do not let these steps become skippable or `|| true`.
jobs:
  drift:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches production. A newer image would accept syntax the server
        # rejects, which is how a migration passes CI and fails on deploy.
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          # The maintenance database, so the job has somewhere to connect from
          # in order to CREATE DATABASE. Nothing is migrated into it.
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # A database that only migrate deploy ever writes to.
      #
      # This previously pointed at the service container's own database, which
      # was also passed as --shadow-database-url. migrate diff replays into its
      # shadow without writing _prisma_migrations, so the later migrate deploy
      # found a populated schema with no history and failed with P3005.
      #
      # ci_migrate is created empty and only migrate deploy ever builds it.
      # No shadow database is needed: the drift check below compares that built
      # database against the models directly, which is the real deploy path
      # rather than a replay of it.
      #
      # Job-level rather than per-step because prisma.config.ts reads
      # DATABASE_URL at load time, and npm ci runs prisma generate through
      # postinstall — so the variable has to exist before any database does.
      # Safe as a single value now that nothing else claims a database here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_migrate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create the migration database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ci_migrate'

      - name: Baseline and migrations build the schema
        run: npx prisma migrate deploy

      - name: Migrations reproduce schema.prisma
        run: |
          # Compares the database migrate deploy just built against the models.
          # Any difference means a model was edited without a migration.
          if npx prisma migrate diff \
              --from-schema-datasource prisma/schema.prisma \
              --to-schema-datamodel prisma/schema.prisma \
              --exit-code; then
            echo "Migrations and schema agree."
            exit 0
          fi

          echo "::error::prisma/migrations does not reproduce schema.prisma."
          echo "Run 'npx prisma migrate dev' to generate the missing migration."
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma --script
          exit 1

      - name: Database objects Prisma cannot see
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f prisma/tests/constraints.sql
          echo "Constraints behave as specified."
