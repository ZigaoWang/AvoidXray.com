name: Schema

on:
  push:
    branches: [main]
  pull_request:

# Two things the repository cannot otherwise prove about itself:
#
#   1. prisma/migrations still reproduces schema.prisma. Deploy applies
#      migrations, so a model change with no migration behind it would reach
#      production as code expecting columns nothing created.
#
#   2. The CHECK constraints still exist and still bite. schema.prisma cannot
#      express them, so `migrate diff` passes whether they are there or not.
#
# Replaying from empty is also the only place 0_baseline is ever exercised.
# Production is recorded as having applied it and never will again, so this job
# is the sole evidence that the baseline can build the schema it claims to —
# which is precisely the property the SQLite-era history turned out to lack.
# Do not let these steps become skippable or `|| true`.
jobs:
  drift:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches production. A newer image would accept syntax the server
        # rejects, which is how a migration passes CI and fails on deploy.
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          # The maintenance database, so the job has somewhere to connect from
          # in order to CREATE DATABASE. Nothing is migrated into it.
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The database migrate deploy builds, and the only one any step here uses.
      #
      # This previously pointed at the service container's own database, which
      # was also passed as --shadow-database-url. migrate diff replays into its
      # shadow without writing _prisma_migrations, so the later migrate deploy
      # found a populated schema with no history and failed with P3005.
      #
      # ci_migrate is created empty and only migrate deploy ever builds it.
      # No shadow database is needed: the drift check below compares that built
      # database against the models directly, which is the real deploy path
      # rather than a replay of it.
      #
      # Job-level rather than per-step because prisma.config.ts reads
      # DATABASE_URL at load time, and npm ci runs prisma generate through
      # postinstall — so the variable has to exist before any database does.
      # Safe as a single value now that nothing else claims a database here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_migrate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Neither needs a database, so both run before one exists and a failure is
      # reported without first waiting on migrations and a build. The suite
      # covers the open redirect guard, EXIF and GPS stripping, the rate
      # limiter's handling of a forged client address, the feed's scope SQL, the
      # duplicate-detection thresholds and the catalog write funnel. Until it
      # ran here it ran only on whichever machine a contributor chose to run it
      # on, so a regression in any of those merged and deployed behind a green
      # check.
      - name: Source passes the linter
        run: npm run lint

      - name: Tests pass
        run: npm test

      - name: Create the migration database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ci_migrate'

      - name: Baseline and migrations build the schema
        run: npx prisma migrate deploy

      - name: Migrations reproduce schema.prisma
        run: |
          # Compares the database migrate deploy just built against the models.
          # Any difference means a model was edited without a migration.
          if npx prisma migrate diff \
              --from-schema-datasource prisma/schema.prisma \
              --to-schema-datamodel prisma/schema.prisma \
              --exit-code; then
            echo "Migrations and schema agree."
            exit 0
          fi

          echo "::error::prisma/migrations does not reproduce schema.prisma."
          echo "Run 'npx prisma migrate dev' to generate the missing migration."
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma --script
          exit 1

      - name: Database objects Prisma cannot see
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f prisma/tests/constraints.sql
          echo "Constraints behave as specified."

      # scripts/test/revisionPipeline.test.ts is deliberately absent from
      # `npm test`, because it is the one test that needs a live database and
      # that script has to run on a machine without one. It is also the only
      # check on the claim that an admin edit, its version bump and its
      # provenance row land in a single transaction, which is the entire
      # argument for having removed the immediate write path. Run nowhere, that
      # claim was being assumed rather than proved.
      #
      # It reads one film stock and one administrator, and a database built from
      # migrations alone has neither: the migrations seed brands and nothing
      # else. Hence the fixture, which is written after the constraints file so
      # that file keeps asserting against a database holding only what the
      # migrations put there.
      - name: Rows the revision pipeline test reads
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "User" (id, email, "passwordHash", username, "isAdmin")
          VALUES ('ci_admin', 'ci-admin@example.invalid', 'not-a-password-hash', 'ci_admin', true);

          INSERT INTO "FilmStock"
            (id, name, process, chromaticity, polarity, "colorBalance",
             "brandId", "manufacturerStatus")
          VALUES ('ci_stock', 'CI Revision Pipeline 400', 'C-41', 'COLOR', 'NEGATIVE',
                  'Daylight', 'brand_kodak', 'SAME_AS_BRAND');
          SQL

      - name: An admin edit and its provenance land together
        run: npx tsx scripts/test/revisionPipeline.test.ts
        # ci_migrate is built fresh for this run, so the test's guard against
        # writing to a real database does not apply.
        env:
          ALLOW_DB_TEST: '1'

      # Also needs a database, and for the same reason: what it checks is
      # authorize() answering against real rows. It creates its own account and
      # removes it again, so it needs no fixture.
      - name: The credentials gate refuses what it should
        run: npx tsx scripts/test/authGate.test.ts

      # Seeds a community photo and an archive photo and runs the real feed,
      # count, profile, search and leaderboard queries against them. It creates
      # what it needs and removes it again.
      - name: Archive photos stay out of community surfaces
        run: npx tsx scripts/test/archiveVisibility.test.ts
        env:
          ALLOW_DB_TEST: '1'

      # Seeds a public photo beside a private one, a draft, held, pending and
      # rejected ones and one in the trash, and runs the real feed, count,
      # profile, album, search, related, sitemap and report queries as a
      # stranger and as the owner. It creates what it needs and removes it.
      - name: Hidden photos stay out of every surface
        run: npx tsx scripts/test/photoPrivacy.test.ts
        env:
          ALLOW_DB_TEST: '1'

      # An import from registration to private photo, through the local
      # stand-in for the bucket: duplicates skipped, uploads resumed, the
      # stored bytes checked against the hash, the storage limit held.
      - name: Imports land as private photos in their rolls
        run: npx tsx scripts/test/libraryImport.test.ts
        env:
          ALLOW_DB_TEST: '1'
          VISION_URL: http://127.0.0.1:9

      # The build itself runs this through postbuild. Repeated here so a change
      # that puts the database client in the browser fails the pull request
      # rather than only the deploy.
      - name: Database client stays out of the browser
        run: npm run build
